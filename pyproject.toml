[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-introspect-mcp"
version = "0.1.0"
description = "MCP server for introspecting a running ATLAS instance: conversations, mcp.json, workspaces, and custom prompts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
atlas-introspect-mcp = "atlas_introspect_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_introspect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
